ServerTokens Prod
ServerSignature Off

# ---------- GraphQL reverse proxy ----------
# The app calls /graphql on its own host. Apache forwards those requests to
# the real GraphQL server, set per environment with the GRAPHQL_UPSTREAM
# env var on the Deployment, e.g.
#   https://api.example.org/graphql
#   http://graphql-api.my-namespace.svc:8080/graphql
ProxyRequests Off
ProxyPreserveHost Off
ProxyTimeout 60

# Needed when GRAPHQL_UPSTREAM is https://
SSLProxyEngine On

ProxyPass        /graphql ${GRAPHQL_UPSTREAM}
ProxyPassReverse /graphql ${GRAPHQL_UPSTREAM}

<Directory "/var/www/html">
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted

    # Single-page app routing: unknown paths serve index.html
    # so client-side routes like /cohorts/123 work on refresh.
    FallbackResource /index.html
</Directory>

<IfModule mod_headers.c>
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    # Never cache index.html, so users pick up new deployments
    <FilesMatch "index\.html$">
        Header set Cache-Control "no-cache, no-store, must-revalidate"
    </FilesMatch>

    # Hashed build assets can be cached for a long time
    <FilesMatch "\.(js|css|woff2?|ttf|svg|png|jpe?g|gif|ico)$">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </FilesMatch>
</IfModule>

<IfModule mod_deflate.c>
    AddOutputFilterByType DEFLATE text/html text/css application/javascript application/json image/svg+xml
</IfModule>