ServerTokens Prod
ServerSignature Off

<Directory "/var/www/html">
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted

    # Single-page app routing: unknown paths serve index.html
    # so client-side routes like /cohorts/123 work on refresh.
    FallbackResource /index.html
</Directory>

<IfModule mod_headers.c>
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    # Never cache index.html, so users pick up new deployments
    <FilesMatch "index\.html$">
        Header set Cache-Control "no-cache, no-store, must-revalidate"
    </FilesMatch>

    # Hashed build assets can be cached for a long time
    <FilesMatch "\.(js|css|woff2?|ttf|svg|png|jpe?g|gif|ico)$">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </FilesMatch>
</IfModule>

<IfModule mod_deflate.c>
    AddOutputFilterByType DEFLATE text/html text/css application/javascript application/json image/svg+xml
</IfModule>