ServerTokens Prod
ServerSignature Off

# ---------- Cohort builder middleware proxy ----------
# The app calls /cb/{open,auth}/query on its own host. Apache forwards them
# to the middleware, set per environment with CB_MIDDLEWARE_URL on the
# Deployment: base URL only
ProxyRequests Off
ProxyPreserveHost Off
ProxyTimeout 60

SSLProxyEngine On
SSLProxyVerify require
SSLProxyVerifyDepth 5
SSLProxyCACertificateFile /etc/pki/tls/certs/ca-bundle.crt
SSLProxyCheckPeerName on
SSLProxyCheckPeerExpire on

<LocationMatch "^/api/cb/open/query$">
    ProxyPassMatch ${MIDDLEWARE_URL}/api/cb/open/query
</LocationMatch>

<Directory "/var/www/html">
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted

    # Single-page app routing: unknown paths serve index.html
    # so client-side routes like /cohorts/123 work on refresh.
    FallbackResource /index.html
</Directory>

<IfModule mod_headers.c>
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    # Never cache index.html, so users pick up new deployments
    <FilesMatch "index\.html$">
        Header set Cache-Control "no-cache, no-store, must-revalidate"
    </FilesMatch>

    # Only Vite's content-hashed output is safe to cache forever
    <LocationMatch "^/assets/">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>
</IfModule>

<IfModule mod_deflate.c>
    AddOutputFilterByType DEFLATE text/html text/css application/javascript application/json image/svg+xml
</IfModule>